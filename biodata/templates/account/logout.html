{% extends "biodata/base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Sign Out</h1>
        <p>Are you sure you want to sign out?</p>

        <form method="post" action="{% url 'account_logout' %}" style="display: flex; flex-direction: column; gap: 1rem;">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            <button type="submit" class="btn btn-solid" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem;">
                Sign Out
            </button>
            <a href="{% url 'home' %}" class="btn btn-ghost" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem;">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
