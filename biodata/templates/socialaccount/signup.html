{% extends "biodata/base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>Sign Up</h1>
        <p>You are about to sign in with a third-party account. Please confirm to continue.</p>

        <form style="display: flex; flex-direction: column; gap: 1rem;" id="signup_form" method="post" action="{% url 'socialaccount_signup' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-solid" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem;">
                Continue
            </button>
            <a href="{% url 'home' %}" class="btn btn-ghost" style="width: 100%; justify-content: center; padding: 0.9rem; font-size: 1rem;">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
